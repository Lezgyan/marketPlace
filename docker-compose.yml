version: "3.8"
services:
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch_market
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
      - ./elasticsearch/config/analysis:/usr/share/elasticsearch/config/analysis

  kibana:
    image: kibana:8.11.0
    container_name: kibana_market
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
  db:
    image: postgres:16
    container_name: marketplace-postgres
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: redis_db
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

#    # Опционально: удобный UI для просмотра ключей
#    redisinsight:
#      image: redis/redisinsight:latest
#      container_name: redisinsight
#      ports:
#        - "5540:5540"
#      depends_on:
#        - redis_db
#      restart: unless-stopped


volumes:
  elastic_data:
  pgdata:
  redis_data: